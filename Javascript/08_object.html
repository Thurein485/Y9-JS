<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Object</title>
</head>
<body>
    <h1>JS Objects</h1>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        // const person = {firstName: "John", lastName: "Doe", age:50, eyeColor: "blue"};
        const person = new Object();
        person.firstName = "John";
        person.lastName = "Doe";
        person.age = 50;
        person.eyeColor = "blue";

        // add new property
        person.nationality = "English";
        // delete the property
        delete person.lastName;

        document.getElementById("demo1").innerHTML = "His full name is: " + person.firstName + " " + person.lastName;
        document.getElementById("demo2").innerHTML = "His nationality is: " + person.nationality;
    </script>
</body>
</html>
