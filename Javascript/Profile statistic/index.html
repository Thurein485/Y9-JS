<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Statistic</title>
     
     <!-- Bootstrap CDN Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- External CSS -->
     <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-3">
                <fieldset>
                    <legend class="float-none w-auto"><i class="bi bi-briefcase"></i></legend>
                    <div class="counter" data_ceil="15">15</div>
                    <h4>User Experience</h4>
                </fieldset>
            </div>
            <div class="col-md-3">
                <fieldset>
                    <legend class="float-none w-auto"><i class="bi bi-briefcase"></i></legend>
                    <div class="counter" data_ceil="260">260</div>
                    <h4>Websites Made </h4>
                </fieldset>
            </div>
            <div class="col-md-3">
                <fieldset>
                    <legend class="float-none w-auto"><i class="bi bi-briefcase"></i></legend>
                    <div class="counter" data_ceil="26">26</div>
                    <h4>Applications Made</h4>
                </fieldset>
            </div>
        </div>
    </div>
    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
