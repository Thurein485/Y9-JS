<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JS Array</h1>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        const color_list = ["red", "green", "black", "blue", "pink"]
        document.getElementById("demo1").innerHTML = color_list[2];
        let length = color_list.length;
        document.getElementById("demo2").innerHTML = "The length of the color list is: " + length;

        // pop and push method
        let removed_item = color_list.pop();
        console.log(color_list);
        console.log("The removed item is: ", removed_item);
        color_list.push("yellow");
        console.log("Array after pushing new item: ", color_list);

        // concat
        const myGirls = ["Cecilie", "Lone"];
        const myBoys = ["Peter", "Lars", "Jonas"];
        const myChildren = myGirls.concat(myBoys);
        // myChildren = {"Cecilie", "Lone", "Peter", "Lars", "Jonas"};
        console.log("My children are: ", myChildren);

        // splice
        let splice_items = myChildren.splice(1, 2, "Khit");
        console.log("My children after splicing: ", myChildren);
        console.log("The splice items are: ", splice_items);

        // shift() removes the first element from the array
        let fruits = ["Apple", "Banana", "Orange", "Mango", "Grapes"];

        let result = fruits.shift();
        console.log("Shift value: ", result);
        console.log("After shift: ", fruits);

        // unshift() adds an element to the beginning of the array
        result = fruits.unshift("Strawberry");
        console.log("Unshift value: ", result);
        console.log("After unshift: ", fruits);

        // slice() method
        // The slice() method returns a portion of an array without changing the original array.

        result = fruits.slice(2);
        console.log("Slice value: ", result);
        console.log("After slice: ", fruits);

        // Selects elements from index 1 up to (but not including) index 3.
        result = fruits.slice(1, 3);
        console.log("Second slice value: ", result);
        console.log("After second slice: ", fruits);
    </script>
</body>

</html>
