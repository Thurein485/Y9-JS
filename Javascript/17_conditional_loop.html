<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS Conditional loop</h1>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>

    <script>
        let i = 1;
        let txt = "";
        while (i<6){
            txt+= i + "'<br>";
            i++;
        }
        document.getElementById("demo1").innerHTML = txt;
    </script>
</body>
</html>
