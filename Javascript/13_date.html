<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS Date</h1>

    <script>
        const d = new Date();
        console.log("Current date and time is: ", d);
        // get method
        console.log("Current year:", d.getMonth());

        const myDate = new Date("2025-1-12");
        console.log("Assigned Date is: ", myDate);
        // set method
        const set_date = new Date();
        set_date.setFullYear(2020,5,16);
        console.log("Set Date is: ", set_date);
    </script>
</body>
</html>
