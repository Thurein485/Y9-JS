<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>HTML Events</h2>
    <p>Today is <span id="demo1"></span></p>
    <button type="button" onclick="document.getElementById('demo1').innerHTML=Date()">Click Me</button>
    <br><br>
    <button type="button" onclick="this.innerHTML=Date()">Show Date</button>
    <br><br>
    <p>You selected: <span id="demo2"></span></p>
    <!-- Dropdown List -->
     <label for="">Choose your fav car:</label>
     <select name="cars" id="cars" onchange="myFunction()">
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
        <option value="toyota">Toyota</option>
    </select>

    <script>
        function myFunction() {
            document.getElementById("demo2").innerHTML = document.getElementById("cars").value;
        }
    </script>
</body>
</html>
