<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS String Methods</h1>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        let text1 = "Welcome \"EDUSN\" School!";
        let text2 = "Hello".concat(" ", "World");
        let len = text1.length;
        console.log(len);
        console.log(text2);
        document.getElementById("demo1").innerHTML = text1;
        document.getElementById("demo2").innerHTML = text1.toLowerCase();

        let text3 = "Hello my friends, welcome to my class!"
        console.log("The index of my \ 'my\': ", text3.indexOf("my", 10));
        console.log("The last index of \'my\': ", text3.lastIndexOf("mi"));
        console.log("Search Method: ", text3.search("my"));
    </script>
</body>
</html>
