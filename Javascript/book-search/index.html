<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book Search</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container py-4">
      <!-- Search Box -->
      <div class="search-wrapper mb-4">
        <input type="text" class="form-control" placeholder="Search Books..." />
      </div>

      <!-- Book Cards -->
      <div class="row g-4">
        <!-- Science -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="book-card">
            <img src="images/science.jpeg" alt="Science" class="book-image" />

            <h2>Science</h2>

            <button class="explore-btn">Explore More</button>
          </div>
        </div>

        <!-- ICT -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="book-card">
            <img src="images/ict.jpeg" alt="ICT" class="book-image" />

            <h2>ICT</h2>

            <button class="explore-btn">Explore More</button>
          </div>
        </div>

        <!-- Social Studies -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="book-card">
            <img src="images/ss.jpeg" alt="Social Studies" class="book-image" />

            <h2>Social Studies</h2>

            <button class="explore-btn">Explore More</button>
          </div>
        </div>

        <!-- English -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="book-card">
            <img src="images/english.jpeg" alt="English" class="book-image" />

            <h2>English</h2>

            <button class="explore-btn">Explore More</button>
          </div>
        </div>

        <!-- Math -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="book-card">
            <img src="images/math.jpeg" alt="Math" class="book-image" />

            <h2>Math</h2>

            <button class="explore-btn">Explore More</button>
          </div>
        </div>

        <!-- GP -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="book-card">
            <img src="images/GP.jpeg" alt="GP" class="book-image" />

            <h2>GP</h2>

            <button class="explore-btn">Explore More</button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
