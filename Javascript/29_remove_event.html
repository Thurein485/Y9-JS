<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remove Event Handler</title>
  </head>
  <body>
    <div id="myDiv">
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Alias itaque quam magni tempora sed id numquam commodi! Nihil amet modi doloremque minus maiores! Velit architecto pariatur eius
        facere! Molestias, rem?
      </p>
      <button type="button" onclick="removeHandler()">Remove Event</button>
    </div>

    <p id="demo"></p>

    <script>
      document.getElementById("myDiv").addEventListener("mousemove", myFunction);

      function myFunction() {
        document.getElementById("demo").innerHTML = Math.random();
      }

      function removeHandler() {
        document.getElementById("myDiv").removeEventListener("mousemove", myFunction);
      }
    </script>
  </body>
</html>
