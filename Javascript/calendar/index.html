<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CDN CSS Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap CDN Icon Link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- AOS CSS Link -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
    <div class="container my-5">
        <div class="row g-4">
            <!-- Calendar -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <!-- Calendar Header -->
                    <div class="calendar-header p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 id="monthYear" class="text-white mb-0">Calendar</h2>
 
                            <div>
                                <!-- Previous -->
                                <button id="prevBtn" class="btn btn-outline-light me-2">
                                    <i class="bi bi-chevron-left"></i>
                                </button>
 
                                <!-- Next -->
                                <button id="nextBtn" class="btn btn-outline-light">
                                    <i class="bi bi-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
 
                    <!-- Calendar Body -->
                    <div class="card-body">
                        <!-- Weekdays -->
                        <div class="row text-center fw-bold mb-2">
                            <div class="col">Sun</div>
                            <div class="col">Mon</div>
                            <div class="col">Tue</div>
                            <div class="col">Wed</div>
                            <div class="col">Thu</div>
                            <div class="col">Fri</div>
                            <div class="col">Sat</div>
                        </div>
 
                        <!-- Days -->
                        <div id="days" class="calendar-days"></div>
                    </div>
                </div>
            </div>
 
            <!-- Event Section -->
            <div class="col-lg-4">
                <div class="pt-2">
                    <p>
                        Selected Date:
                        <span id="selectedDate"></span>
                    </p>
 
                    <input type="text" id="eventTitle" class="form-control mb-2" placeholder="Event Title" />
 
                    <button id="addEvent" class="btn btn-primary w-100">Add Event</button>
 
                    <h5 class="mt-4">Events</h5>
 
                    <ol id="eventList"></ol>
                </div>
            </div>
        </div>
    </div>
 
 
 
 
    <!-- Bootstrap CDN js Link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
 
    <!-- Aos js link -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Initiate AOS -->
    <script>AOS.init();</script>
    <!-- JavaScript -->
    <script src="script.js"></script>
 
</body>
 
</html>
