<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Conditional Loop with Boolean</h1>
    <p id="demo1"></p>

    <script>
        let i = 0;
        let txt = "";

        while(true){
            txt += i + "<br>";
            i++;

            // to stop the loop
            if (i == 4){
                break;
            };
        }
        document.getElementById("demo1").innerHTML = txt;
    </script>
</body>
</html>
