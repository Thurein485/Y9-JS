<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
     <!-- Bootstrap CDN Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        #ewarning, #pwarning{
            color: red;
            display: none;
        }
        #link {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                 <form action="" id="myform" class="bg-light p-5 mt-5 rounded-3 shadow">
                    <label for="fname" class="form-label">User Name:</label>
                    <input type="text" id="fname" name="fname" value="" class="form-control"><br>
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" name="email" id="email" value="" class="form-control">
                     <small id="ewarning">*You Email Format is not correct. </small><br>
                    <label for="code" class="form-label">Login Code:</label>
                    <input type="number" id="code" name="lcode" value="" class="form-control"><br>
                    <label for="psw" class="form-label">Password:</label>
                    <input type="password" name="psw" id="psw" class="form-control">
                    <small id="pwarning">*Your password is weak. Number of letters should be at least 8. </small><br><br>
                    <button class="btn btn-secondary" type="submit" onclick="myValidate()"><a id="link" href="#">Login</a></button>      
                </form>
            </div>
        </div>
    </div>
 
    <script>
        let code = "111";
        function myValidate(){
            const x = document.forms["myform"];
            const name = x.elements[0].value;
            const e = x.elements[1].value;
            const v = e.includes("@"); // to save return value true or false for email
            const c = x.elements[2].value;
            const p = x.elements[3].value;
            //access link
            const a = document.getElementById("link");
            if(name == "" || e == "" || c == "" || p == ""){
                alert("You must fill all inputs.");
            }
            else if(v == false){
                document.getElementById("ewarning").style.display = "block";
            }
            else if(c != code){
                alert("Your login code is not correct.");
            }
            else if(p.length < 8){
                document.getElementById("pwarning").style.display = "block";
            }
            else{
                document.getElementById("link").href = "success.html";
            }
        }
    </script>
</body>
</html>
