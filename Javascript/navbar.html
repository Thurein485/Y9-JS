<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login and Register Modal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">EDUSN</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto ms-lg-4">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"> Services </a>

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Web Development</a></li>
                <li><a class="dropdown-item" href="#">Programming</a></li>
                <li><a class="dropdown-item" href="#">Online Learning</a></li>
              </ul>
            </li>
          </ul>

          <div class="d-flex gap-3">
            <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#loginModal"> Login </a>

            <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#registerModal"> Register </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fw-bold">Login</h2>

            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body p-4">
            <form>
              <div class="mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="Username" required />
              </div>

              <div class="mb-2">
                <input type="password" class="form-control form-control-lg" placeholder="Password" required />
              </div>

              <button type="submit" class="btn btn-primary mt-2">Login</button>

              <a href="#" class="ms-2" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#registerModal"> Go to Register </a>
            </form>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fw-bold">Register</h2>

            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body p-4">
            <form>
              <div class="mb-3">
                <input type="text" class="form-control form-control-lg" placeholder="Username" required />
              </div>

              <div class="mb-3">
                <input type="email" class="form-control form-control-lg" placeholder="Email" required />
              </div>

              <div class="mb-2">
                <input type="password" class="form-control form-control-lg" placeholder="Password" required />
              </div>

              <button type="submit" class="btn btn-primary mt-2">Register</button>

              <a href="#" class="ms-2" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#loginModal"> Go to Login </a>
            </form>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
