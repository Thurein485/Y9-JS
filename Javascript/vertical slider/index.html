<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap icons CDN link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="slider-container">

        <div class="left-slide">
            <div>
                <h2>London</h2>
                <p>Capital of England and the United Kingdom.</p>
            </div>

            <div>
                <h2>Paris</h2>
                <p>Capital of France.</p>
            </div>

            <div>
                <h2>Lavender</h2>
                <p>A fragrant purple flower.</p>
            </div>

            <div>
                <h2>Japan</h2>
                <p>A country in East Asia.</p>
            </div>
        </div>

        <div class="right-slide">
            <div style="background-image: url(images/london.jpeg);"></div>
            <div style="background-image: url(images/paris.jpg);"></div>
            <div style="background-image: url(images/lavender.jpeg);"></div>
            <div style="background-image: url(images/japan.jpeg);"></div>
        </div>

        <!-- action button -->
        <div class="action-buttons">
            <button class="down-button">
                <i class="bi bi-arrow-down-square"></i>
            </button>

            <button class="up-button">
                <i class="bi bi-arrow-up-square"></i>
            </button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
