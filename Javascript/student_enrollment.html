<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Enrollment</title>

    <style>
      body {
        background-color: cornflowerblue;
        font-family: Arial;
        padding: 50px;
      }

      input {
        padding: 10px;
        border: none;
        border-radius: 5px;
      }

      button {
        padding: 10px 40px;
        border: none;
        border-radius: 5px;
        background-color: gray;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: rgb(100, 100, 100);
      }

      .main {
        display: flex;
        gap: 250px;
      }

      #validationCheckIndex {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="main">
      <div>
        <h1>Enroll Students for this year.</h1>

        <form
          onsubmit="
            addStudent();
            return false;
          "
        >
          <input type="text" id="studentInput" placeholder="Enter student name" />
        </form>

        <p>Enrolled Student List:</p>

        <ol id="studentList"></ol>
      </div>

      <div>
        <p>Enter list number to delete...</p>

        <input type="number" id="numberInput" value="1" />

        <button onclick="deleteStudent()">Clear</button>

        <p id="validationCheckIndex"></p>
      </div>
    </div>

    <script>
      let students = [];

      function addStudent() {
        let input = document.getElementById("studentInput");

        let name = input.value;

        if (name == "") {
          input.placeholder = "Please enter a student name.";
        } else if (!isNaN(name)) {
          input.value = "";
          input.placeholder = "Name cannot contain numbers.";
        } else {
          students[students.length] = name;

          input.value = "";

          displayStudents();
        }
      }

      function displayStudents() {
        let list = document.getElementById("studentList");

        list.innerHTML = "";

        for (let i = 0; i < students.length; i++) {
          list.innerHTML += "<li>" + students[i] + "</li>";
        }
      }

      function deleteStudent() {
        let number = document.getElementById("numberInput").value;

        number = Number(number);

        if (students.length == 0) {
          document.getElementById("validationCheckIndex").innerHTML = "Invalid clear! There is no name. Enter the name first";
        } else if (number < 1 || number > students.length) {
          document.getElementById("validationCheckIndex").innerHTML = "That student number does not exist.";
        } else {
          students.splice(number - 1, 1);

          document.getElementById("numberInput").value = "";

          displayStudents();
        }
      }
    </script>
  </body>
</html>
