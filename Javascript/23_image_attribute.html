<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Changing Image Attribute with JS</h2>
    <img id="imgId" src="basketball.png" alt="basketball" style="width: 300px; height: 250px;">
    
    <script>
        document.getElementById("imgId").src = "football.png";
    </script>
</body>
</html>
