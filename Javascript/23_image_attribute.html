<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Changing Image Attribute with JS</h1>

    <img src="basketball.png" alt="" id="img_container"
         style="width: 300px; height: 200px;">

    <button type="button" onclick="changeImg()">Change Image</button>

    <script>

        let currentImage = "basketball";

        function changeImg() {

            let img = document.getElementById("img_container");

            if (currentImage === "basketball") {

                img.src = "football.png";
                currentImage = "football";

            } else if (currentImage === "football") {

                img.src = "basketball.png";
                currentImage = "basketball";

            }
        }

    </script>

</body>

</html>
