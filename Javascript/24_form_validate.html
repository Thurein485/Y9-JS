<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Form Input Presence Check Validation</h2>
    <form action="" id="myForm" onsubmit="validateForm()">
        <label for="">First Name:</label>
        <input type="text" name="fname" value="John"> <br><br>
        <label for="">Last Name:</label>
        <input type="text" name="lname" value="Doe"> <br><br>
        <input type="submit" value="Submit">
    </form>

    <script>
        function validateForm(){
            let x = document.forms["myForm"];
            let first_name = x.elements[0].value;
            if (first_name == "") {
                alert("You must fill all inputs.")
                
            }
        }
    </script>
</body>
</html>
