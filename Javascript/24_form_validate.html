<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Form Input Presence Check Validation</h2>

    <form action="" id="myForm" onsubmit="validateForm()">
      <label for="">First Name:</label>
      <input type="text" name="fname" value="John" /> <br /><br />

      <label for="">Last Name:</label>
      <input type="text" name="lname" value="Doe" /> <br /><br />

      <input type="submit" value="Submit" />
    </form>

    <!-- Number Validation -->
    <h2>Number Validation</h2>

    <input id="numb" />

    <button type="button" onclick="myFunction()">Submit</button>

    <p id="demo"></p>

    <script>
      function validateForm() {
        let x = document.forms["myForm"];
        let first_name = x.elements[0].value;

        if (first_name == "") {
          alert("You must fill all inputs.");
        }
      }

      function myFunction() {
        let x = document.getElementById("numb").value;

        let text;

        if (isNaN(x) || x < 1 || x > 10) {
          text = "Input not valid";
        } else {
          text = "Input OK";
        }

        document.getElementById("demo").innerHTML = text;
      }
    </script>
  </body>
</html>
