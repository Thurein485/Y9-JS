<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Education</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .cta-section {
            padding: 20px;
        }

        .cta-wrapper {
            position: relative;
            width: 100%;
            max-width: 1250px;
            height: 330px;
            margin: 0 auto;
            padding: 35px 50px;
            background: #102840;
            border-radius: 15px;
            overflow: hidden;
        }

        .cta-content {
            position: relative;
            z-index: 5;
        }

        .cta-content h2 {
            max-width: 650px;
            margin: 0 0 18px;
            color: #fff;
            font-size: 34px;
            font-weight: 700;
            line-height: 1.2;
        }

        .cta-content p {
            margin: 0 0 28px;
            color: #fff;
            font-size: 18px;
        }

        .cta-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #fff;
            color: #102840;
            border-radius: 7px;
            font-size: 18px;
            text-decoration: none;
        }

        .cta-btn:hover {
            background: #febb00;
            color: #102840;
        }

        .cta-img {
            position: relative;
            height: 260px;
        }

        .yellow-circle {
            position: absolute;
            top: 0;
            right: -5%;
            z-index: 1;
            width: clamp(230px, 22vw, 285px);
            height: clamp(230px, 22vw, 285px);
            background: #febb00;
            border-radius: 50%;
        }

        .image-circle {
            position: absolute;
            top: 0;
            right: 25%;
            z-index: 4;
            width: clamp(225px, 21.5vw, 280px);
            height: clamp(225px, 21.5vw, 280px);
            overflow: hidden;
            border-radius: 50%;
        }

        .image-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .paper-plane {
            position: absolute;
            right: 30%;
            bottom: 5%;
            z-index: 2;
            width: clamp(170px, 20vw, 250px);
        }

        .paper-plane img {
            display: block;
            width: 100%;
        }

        @media (max-width: 1100px) {
            .cta-wrapper {
                height: 320px;
                padding: 35px;
            }

            .cta-content h2 {
                font-size: 30px;
            }

            .cta-content p {
                font-size: 17px;
            }

            .image-circle {
                right: 20%;
            }

            .yellow-circle {
                right: -8%;
            }

            .paper-plane {
                right: 28%;
                bottom: 5%;
            }
        }

        @media (max-width: 991px) {
            .cta-wrapper {
                min-height: 650px;
                height: auto;
                padding: 40px 25px;
            }

            .cta-content {
                text-align: center;
            }

            .cta-content h2 {
                max-width: 600px;
                margin-right: auto;
                margin-left: auto;
                font-size: 30px;
            }

            .cta-content p {
                font-size: 17px;
            }

            .paper-plane {
                display: none;
            }

            .cta-img {
                height: 300px;
                margin-top: 30px;
            }

            .yellow-circle {
                top: 10px;
                right: 50%;
                width: 250px;
                height: 250px;
                transform: translateX(50%);
            }

            .image-circle {
                top: 10px;
                right: 50%;
                width: 245px;
                height: 245px;
                transform: translateX(50%);
            }
        }

        @media (max-width: 576px) {
            .cta-section {
                padding: 12px;
            }

            .cta-wrapper {
                min-height: 580px;
                padding: 30px 18px;
                border-radius: 12px;
            }

            .cta-content h2 {
                font-size: 26px;
            }

            .cta-content p {
                font-size: 16px;
            }

            .cta-btn {
                padding: 13px 24px;
                font-size: 16px;
            }

            .cta-img {
                height: 260px;
            }

            .yellow-circle {
                width: 220px;
                height: 220px;
            }

            .image-circle {
                width: 215px;
                height: 215px;
            }
        }
    </style>
</head>

<body>

    <section class="cta-section">

        <div class="cta-wrapper">

            <div class="paper-plane">
                <img src="Untitled design.svg" alt="">
            </div>

            <div class="row align-items-center h-100">

                <div class="col-lg-7">

                    <div class="cta-content">

                        <h2>
                            Introducing an Exciting Opportunity for
                            Students Worldwide
                        </h2>

                        <p>
                            Let the journey of organizing your own learning begin
                        </p>

                        <a
                            href="https://edusnglobal.com/"
                            target="_blank"
                            class="cta-btn"
                        >
                            Global Education
                        </a>

                    </div>

                </div>

                <div class="col-lg-5">

                    <div class="cta-img">

                        <div class="yellow-circle"></div>

                        <div class="image-circle">
                            <img
                                src="Tennis 1080P, 2K, 4K, 5K HD wallpapers free download _ WallpaperFlare.png"
                                alt="Students studying together"
                            >
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
